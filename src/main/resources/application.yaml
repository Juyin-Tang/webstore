spring:
  application:
    name: webstore
  datasource:
    url: jdbc:mariadb://localhost:3306/webstore
    username: ${DB_USERNAME:webstore_app}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080